forbidden_inputs:
  - network retrieval
  - unmined web pages or social sources
  - controller drift sample artifacts as authority
  - unrelated frontier candidates except as explicit non-goals
  - any source outside this evidence scope unless a later controller packet authorizes repair
required_citation_behavior:
  - Cite the gist for the three-layer architecture and core layer descriptions.
  - Cite prior KB anchors only for inherited boundary and adopted definition/canon support.
  - Cite repo and ClawHub only for directly mined implementation-flavored details.
  - Cite reports/manifests only as secondary process/gap framing.
  - Distinguish source-backed observations from worker synthesis.
overclaim_boundaries:
  - Do not claim enterprise readiness, measured superiority, scale proof, adoption, or ecosystem maturity.
  - Do not turn supporting tooling into a fourth core layer.
  - Do not collapse this architecture node into detailed workflow.
  - Do not present implementation-specific directories or CLIs as required by the abstract pattern.
