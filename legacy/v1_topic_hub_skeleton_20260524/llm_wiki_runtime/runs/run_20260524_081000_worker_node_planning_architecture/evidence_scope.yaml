      - data/raw/gist_raw/karpathy-gist-llm-wiki/text.txt
      - data/raw/gist_raw/karpathy-gist-llm-wiki/raw.txt
    use_for:
      - direct three-layer architecture: raw sources, wiki, schema
      - raw sources as immutable source of truth
      - wiki as LLM-generated markdown directory with summaries, entity pages, concept pages, comparisons, overview, and synthesis
      - schema or instruction document governing structure, conventions, ingest, answering/query, and maintenance workflows
      - index.md and log.md as navigation/history support
      - optional/modular tooling and implementation-specific choices
      - ingest, query, and lint only as operations that connect the layers
    limitations:
      - Primary abstract architecture authority, not evidence for adoption, enterprise readiness, measured performance, or ecosystem maturity.
