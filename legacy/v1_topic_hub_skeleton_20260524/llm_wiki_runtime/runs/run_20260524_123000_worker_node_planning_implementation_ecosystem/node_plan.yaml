    - nodes/20260524_122000_llm_wiki_implementation_ecosystem/versions/1.0/card.md
    - nodes/20260524_122000_llm_wiki_implementation_ecosystem/versions/1.0/provenance.md
    - nodes/20260524_122000_llm_wiki_implementation_ecosystem/versions/1.0/change.md
  forbidden_generation_paths:
    - nodes/20260524_122000_llm_wiki_implementation_ecosystem/node.yaml
    - kb/
    - generated/
  audit_concerns:
    - "Overclaim from stars/forks to adoption or quality."
    - "Uncited generalization from one implementation to the whole ecosystem."
    - "Prior-KB anchor used as source for new implementation fact."
    - "Directory or README self-description presented as independent validation."
    - "Footnote layout contract violation."
