risk_controls:
  - "Every implementation-family claim must cite direct README/package/plugin/project-page evidence."
  - "Separate primary implementation facts, package/registry metadata, plugin/project-page self-description, process notes, and prior-KB anchors."
  - "Use `github_repo.json` only for snapshot metadata fields, not for adoption, quality, ranking, or usage claims."
  - "Mark README and directory claims as self-described unless independently corroborated."
  - "Phrase common surfaces as observed across cited examples, not universal ecosystem properties."
  - "Use adjacent OpenKB, Obsidian, and graph/MCP sources with explicit boundary language."
  - "Require `## References` before final `## Footnotes`, and `## Footnotes` as the last top-level card section."
adoption_gate:
  generation_entry_decision: pass
  retrieval_required_before_generation: false
  required_generation_paths:
