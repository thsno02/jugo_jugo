schema: kb.node_plan.v1
run_id: run_20260524_123000_worker_node_planning_implementation_ecosystem
executor_role: worker_executor
candidate_id: cand_006_implementation_ecosystem
node_id: 20260524_122000_llm_wiki_implementation_ecosystem
title: "LLM Wiki Implementation Ecosystem"
version_target: "1.0"
source_mining_run: .llmwiki/runs/run_20260524_122000_worker_source_mining_implementation_ecosystem
purpose: >-
  Describe, with local-source evidence only, the implementation ecosystem that has
  formed around the LLM Wiki pattern: project families, toolchain surfaces, file
  and data-model motifs, registry/plugin distribution signals, and evidence
  boundaries for activity versus adoption.
non_goals:
  - "Do not rank implementations or pick a winner."
  - "Do not claim market share, adoption scale, active usage, package downloads, production deployment, quality, reliability, maturity, or enterprise readiness."
  - "Do not treat stars/forks/open issues as usage, quality, or community consensus."
  - "Do not generalize long-document, multimodal, Obsidian, MCP, or graph capabilities beyond sources that explicitly claim them."
  - "Do not use blocked Reddit/community pages, directories, or prior KB nodes to support new implementation facts."
claim_outline:
  - claim_id: implementation_families_in_local_corpus
    planned_claim: >-
      The local corpus supports a descriptive landscape of several implementation
      families: UI/desktop/web app, coding-agent skill/template, CLI/MCP compiler,
      Obsidian/local-first workflow, graph/MCP vault tool, Python package/library,
      plugin/runtime distribution, multi-runtime command/plugin, and adjacent
      long-document/OpenKB-like systems.
    required_citations:
      - repo-nashsu-llm-wiki
      - repo-samuraigpt-llm-wiki-agent
      - repo-atomicstrata-llm-wiki-compiler
      - repo-kytmanov-obsidian-local
      - repo-ngmeyer-librarian-mcp
      - pypi-my-llm-wiki
      - pypi-llm-wiki-mcp
      - clawhub-llm-wiki-karpathy
      - llm-wiki-net
      - repo-vectifyai-openkb
    citation_note: "Use one or more direct implementation citations per family; do not cite process reports for implementation facts."
  - claim_id: common_implementation_surfaces
    planned_claim: >-
      Across direct implementation sources, recurring surfaces include raw/wiki/schema
      or vault-like storage, ingest/compile/query/lint/watch operations, generated
      indexes/logs/graphs, review workflows, citations/provenance controls, and MCP,
      plugin, API, or local-provider integration.
    required_citations:
      - repo-samuraigpt-llm-wiki-agent
      - repo-atomicstrata-llm-wiki-compiler
      - repo-kytmanov-obsidian-local
      - clawhub-llm-wiki-karpathy
      - llm-wiki-net
      - pypi-llm-wiki-mcp
    citation_note: "Phrase as recurring in cited examples, not universal across all implementations."
  - claim_id: registry_plugin_project_metadata
    planned_claim: >-
      PyPI captures, plugin pages, project pages, and GitHub metadata snapshots can
      document package version/classifier/runtime details and repository snapshot
      fields, but only as metadata and distribution-surface signals.
    required_citations:
      - pypi-my-llm-wiki
      - pypi-llm-wiki-mcp
      - clawhub-llm-wiki-karpathy
      - llm-wiki-net
      - github_repo_metadata_batch
    citation_note: "For github_repo.json, cite only stars/forks/open issues/language/license/timestamps; never infer adoption."
  - claim_id: adjacent_system_boundary
    planned_claim: >-
      OpenKB-like, Obsidian vault, graph/MCP, and long-document implementations are
      useful adjacent evidence for implementation breadth, but must be marked as
      adjacent or source-specific rather than collapsed into the LLM Wiki core.
    required_citations:
      - repo-vectifyai-openkb
      - repo-ngmeyer-librarian-mcp
      - repo-kytmanov-obsidian-local
      - reports/source_gap_review.md
    citation_note: "Use reports only for gap/boundary framing, not for implementation facts."
  - claim_id: evidence_quality_and_missing_adoption_evidence
    planned_claim: >-
      The corpus is strong enough for a bounded implementation landscape but lacks
      package downloads, plugin installs, active-user counts, deployment reports,
      issue/PR outcome analysis, and independent quality evaluations.
    required_citations:
      - .llmwiki/runs/run_20260524_122000_worker_source_mining_implementation_ecosystem/evidence_matrix.yaml
      - reports/source_gap_review.md
      - reports/coverage_framework.md
    citation_note: "Frame this as process/gap context and source-quality warning."
