risk_controls:
  - "Label every source tier: direct, implementation self-description, adjacent, process/gap, or prior-KB continuity."
  - "Tie empirical or benchmark-style claims to source, method/baseline scope, and limitation."
  - "Forbid unsupported claims of superiority, ROI, enterprise readiness, production reliability, adoption, or benchmark leadership."
  - "Do not imply citation presence equals citation support."
  - "Keep Knowledge Compounding claims abstract-level unless later full-text/log mining is authorized."
  - "Record deferred retrieval explicitly inside card/provenance/change."
  - "Require `## References` before final `## Footnotes`; `## Footnotes` must be the last top-level card section."
