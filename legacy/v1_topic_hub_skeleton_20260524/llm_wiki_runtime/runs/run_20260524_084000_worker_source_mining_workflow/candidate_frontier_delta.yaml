    candidate_statement: "LLM Wiki 的核心 workflow 可被首版界定为一个 bounded maintenance loop：人类策展 raw sources 并指导重点，LLM/agent 在 schema/instruction 约束下执行 ingest/source intake、compile/wiki update、query/synthesis、lint/health-check、update/file-back 与 index/log maintenance；实现可通过 CLI/MCP、review queue、hash/incremental compile、representation readiness、source/citation validation、gap mapping 和 deterministic runtime writes 支撑这些阶段，但这些工具是实现变体而非抽象必要条件。"
    why_it_matters: "该节点把已采用的 origin/canon、working definition 与三层 architecture 转成可执行维护流程，为后续 node_planning/generation 提供边界清晰的 workflow candidate，并避免把 workflow 误扩成生态、企业、经验效果或 broad comparison 节点。"
    evidence_state: enough_for_first_version
    missing_evidence:
