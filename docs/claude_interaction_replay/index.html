  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">LW</div>
      <div>
        <p class="brand-name">LLM Wiki · Build Memory</p>
        <div class="brand-sub">jugo_jugo / v0→v5 构建回忆档案</div>
      </div>
    </div>
    <label class="global-search">
      <span class="search-symbol" aria-hidden="true">⌕</span>
      <span style="position:absolute;left:-9999px">搜索用户原话和摘要</span>
      <input id="search" type="search" placeholder="搜索用户原话、决策、动作">
    </label>
    <div class="top-actions">
      <span class="coverage" id="coverage">载入档案</span>
      <div class="mode-switch" aria-label="视图模式">
        <button class="mode-button active" data-mode="overview">版本</button>
        <button class="mode-button" data-mode="replay">交互</button>
        <button class="mode-button" data-mode="module">机制</button>
        <button class="mode-button" data-mode="compare">对比</button>
      </div>
    </div>
  </header>

  <div class="shell">
    <aside class="versions" aria-label="上下文导航">
      <div class="rail-sticky" id="context-rail"></div>
    </aside>

    <main class="content" id="main"><div class="empty">正在读取版本档案…</div></main>

    <aside class="evidence" aria-label="证据与完整性">
      <div class="evidence-sticky" id="evidence-panel"></div>
    </aside>
  </div>

  <script>
    const state = {
      archive: null, versions: [], sources: [], mappings: [], events: [],
      timeline: null, moduleRegistry: [], modules: [], selected: "v0",
      mode: "overview", filter: "all", phaseFilter: "all", compareLens: "all", query: "", timelineDensity: "milestones",
      selectedModule: "ingestion", selectedStage: null,
      moduleFocus: "map", designPanel: "observations"
    };
    const labels = { idea:"洞察", question:"问题", correction:"纠偏", decision:"决定", instruction:"指令", preference:"偏好", open_question:"开放问题", observed_effect:"效果" };
    const phaseLabels = { precursor:"前置决策", handoff:"启动交接", execution:"版本执行", transition_out:"转向下一版", retrospective:"后验复盘", operational_context:"运行环境" };
    const phaseOrder = { precursor:0, operational_context:1, handoff:2, execution:3, transition_out:4, retrospective:5 };
    const phaseCodes = { precursor:"PRE", operational_context:"OPS", handoff:"GO", execution:"RUN", transition_out:"NEXT", retrospective:"RET" };
    const compareLensLabels = {all:"全景比较", core:"版本核心", added:"新增机制", replaced:"替换内容", trigger:"下一版触发"};
    const trailLabels = [["problem","触发问题"],["decision","关键决策"],["action","实际动作"],["artifact","可验证产物"],["next_trigger","下一版触发"]];
    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    const short = (value, max=52) => value.length > max ? value.slice(0, max) + "…" : value;
    const formatTime = value => value ? new Intl.DateTimeFormat("zh-CN", {timeZone:"Asia/Shanghai",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(value)) : "时间未记录";

    async function loadJson(path) {
      const response = await fetch(path, {cache:"no-store"});
      if (!response.ok) throw new Error(`${path}: ${response.status}`);
      return response.json();
    }
    async function loadJsonl(path) {
      try {
        const response = await fetch(path, {cache:"no-store"});
        if (!response.ok) return [];
        const text = await response.text();
        return text.split(/\r?\n/).filter(Boolean).map(line => JSON.parse(line));
      } catch { return []; }
    }

    function selectedVersion() { return state.versions.find(v => v.version_id === state.selected) || state.versions[0]; }
    function relationFor(event, versionId=state.selected) {
      return event.version_relations.find(item => item.version_id === versionId)?.relation || "execution";
    }
    function sortVersionEvents(events, versionId=state.selected) {
      return [...events].sort((a,b) => {
        const phaseDelta = (phaseOrder[relationFor(a,versionId)] ?? 99) - (phaseOrder[relationFor(b,versionId)] ?? 99);
        if (phaseDelta) return phaseDelta;
        return String(a.times.source_recorded_at || "").localeCompare(String(b.times.source_recorded_at || ""));
      });
    }
    function withVersionOrdinals(events, versionId=state.selected) {
      const fullOrder = sortVersionEvents(state.events.filter(event => event.version_ids.includes(versionId)), versionId);
      const ordinals = new Map(fullOrder.map((event, index) => [event.event_id, index + 1]));
      return events.map(event => ({...event, view_sequence: ordinals.get(event.event_id)}));
    }
    function selectedEvents() {
      let events = state.query ? [...state.events] : state.events.filter(event => event.version_ids.includes(state.selected));
      if (state.filter !== "all") events = events.filter(event => event.event_type === state.filter);
      if (!state.query && state.phaseFilter !== "all") events = events.filter(event => relationFor(event) === state.phaseFilter);
      if (state.query) {
        const q = state.query.toLowerCase();
        events = events.filter(event => [event.user.verbatim, event.assistant.summary, ...(event.assistant.core_insights || []), ...(event.assistant.actions || [])].join(" ").toLowerCase().includes(q));
      }
      return state.query
        ? events.sort((a,b) => String(a.times.source_recorded_at || "").localeCompare(String(b.times.source_recorded_at || "")))
        : withVersionOrdinals(sortVersionEvents(events));
    }
    function eventById(eventId) { return state.events.find(event => event.event_id === eventId); }
    function selectedModuleData() { return state.modules.find(module => module.module_id === state.selectedModule) || state.modules[0]; }
    function timelineFor(versionId) { return state.timeline?.timelines.find(timeline => timeline.version_id === versionId) || null; }
    function evidenceForStage(stage) {
      const selected = stage.evidence.filter(item => eventById(item.event_id)?.version_ids.includes(state.selected));
      return selected.length ? selected : stage.evidence;
    }
    function controlState(control) {
      const evolution = (control.evolution || []).find(item => item.version_id === state.selected);
      const status = evolution?.status || control.status;
      const factStatus = status === "failed" || status === "missed" ? "observed_failure" : status === "specified" ? "specified" : status === "absent" || status === "retrospective" || status === "replaced" ? "retrospective" : "executed";
      const module = selectedModuleData();
      const coverage = evolution && state.selected !== module?.primary_demo_version ? "version scoped" : control.coverage;
      return {status, factStatus, coverage, summary:evolution?.summary || control.object};
    }

    function renderVersionNav() {
      const rail = document.getElementById("context-rail");
      rail.classList.toggle("node-context", state.mode !== "overview");
      if (state.mode === "module") {
        const module = selectedModuleData();
        if (!module) return;
        if (!state.selectedStage || !module.stages.some(stage => stage.stage_id === state.selectedStage)) state.selectedStage = module.stages[0].stage_id;
        const sequenceById = new Map(module.stages.map(stage => [stage.stage_id, String(stage.sequence).padStart(2,"0")]));
        const feedbackEdges = module.edges.filter(edge => edge.type === "feedback" || edge.type === "rework");
        const selectedNode = state.moduleFocus === "map" ? "focus:map" : state.moduleFocus === "design" ? "focus:design" : `stage:${state.selectedStage}`;
        rail.innerHTML = `<div class="module-rail-desktop"><p class="eyebrow">Mechanism Nodes</p><p class="module-rail-project">${esc(module.title)}</p>
          <div class="module-rail-switch">${state.modules.map(item => `<button class="${item.module_id === module.module_id ? "active" : ""}" data-module-id="${esc(item.module_id)}">${item.kind === "control" ? "审计" : "入库"}</button>`).join("")}</div>
          <nav class="module-rail-list" aria-label="机制流程节点">
            <button class="module-rail-node ${state.moduleFocus === "map" ? "active" : ""}" data-module-focus="map" aria-pressed="${state.moduleFocus === "map"}"><span class="module-rail-code">ALL</span><span><span class="module-rail-name">全局流程</span><span class="module-rail-kind">Mechanism Map</span></span></button>
            <button class="module-rail-node ${state.moduleFocus === "design" ? "active" : ""}" data-module-focus="design" aria-pressed="${state.moduleFocus === "design"}"><span class="module-rail-code">WHY</span><span><span class="module-rail-name">设计依据</span><span class="module-rail-kind">Justification</span></span></button>
            <p class="module-rail-divider">Stages</p>
            ${module.stages.map(item => `<button class="module-rail-node ${state.moduleFocus === "stage" && item.stage_id === state.selectedStage ? "active" : ""}" data-stage-id="${esc(item.stage_id)}" data-outcome="${esc(item.outcome)}" aria-pressed="${state.moduleFocus === "stage" && item.stage_id === state.selectedStage}" title="${esc(item.label)}"><span class="module-rail-code">${String(item.sequence).padStart(2,"0")}</span><span><span class="module-rail-name">${esc(item.label)}</span><span class="module-rail-kind">${esc(item.stage_kind)}</span></span></button>`).join("")}
          </nav>
          ${feedbackEdges.length ? `<div class="module-rail-feedback">${feedbackEdges.map(edge => `<span><strong>↺ ${esc(edge.type)}</strong> · ${esc(sequenceById.get(edge.from) || edge.from)} → ${esc(sequenceById.get(edge.to) || edge.to)}</span>`).join("")}</div>` : ""}</div>
          <div class="module-rail-mobile"><select data-module-select aria-label="机制模块">${state.modules.map(item => `<option value="${esc(item.module_id)}" ${item.module_id === module.module_id ? "selected" : ""}>${esc(item.title)}</option>`).join("")}</select><select data-module-node-select aria-label="机制阅读节点"><option value="focus:map" ${selectedNode === "focus:map" ? "selected" : ""}>全局流程</option><option value="focus:design" ${selectedNode === "focus:design" ? "selected" : ""}>设计依据</option>${module.stages.map(item => `<option value="stage:${esc(item.stage_id)}" ${selectedNode === `stage:${item.stage_id}` ? "selected" : ""}>${String(item.sequence).padStart(2,"0")} · ${esc(item.label)}</option>`).join("")}</select></div>`;
        return;
      }
      if (state.mode === "replay") {
        if (state.query) {
          const q = state.query.toLowerCase();
          const matches = state.events.filter(event => [event.user.verbatim, event.assistant.summary, ...(event.assistant.core_insights || []), ...(event.assistant.actions || [])].join(" ").toLowerCase().includes(q));
          const typeCounts = matches.reduce((counts,event) => ({...counts,[event.event_type]:(counts[event.event_type] || 0) + 1}), {});
          rail.innerHTML = `<div class="module-rail-desktop"><p class="eyebrow">Search Nodes</p><p class="module-rail-project">${matches.length} 条匹配输入</p><nav class="module-rail-list" aria-label="搜索结果类型"><button class="module-rail-node ${state.filter === "all" ? "active" : ""}" data-filter="all" aria-pressed="${state.filter === "all"}"><span class="module-rail-code">ALL</span><span><span class="module-rail-name">全部结果</span><span class="module-rail-kind">${matches.length} events</span></span></button>${Object.entries(typeCounts).map(([type,count]) => `<button class="module-rail-node ${state.filter === type ? "active" : ""}" data-filter="${esc(type)}" aria-pressed="${state.filter === type}"><span class="module-rail-code">${esc((labels[type] || type).slice(0,2))}</span><span><span class="module-rail-name">${esc(labels[type] || type)}</span><span class="module-rail-kind">${count} events</span></span></button>`).join("")}</nav></div><div class="module-rail-mobile"><select data-event-filter-select aria-label="搜索结果类型"><option value="all" ${state.filter === "all" ? "selected" : ""}>全部结果 · ${matches.length}</option>${Object.entries(typeCounts).map(([type,count]) => `<option value="${esc(type)}" ${state.filter === type ? "selected" : ""}>${esc(labels[type] || type)} · ${count}</option>`).join("")}</select></div>`;
          return;
        }
        const version = selectedVersion();
        const events = state.events.filter(event => event.version_ids.includes(version.version_id));
        const phaseCounts = events.reduce((counts,event) => { const phase = relationFor(event); return {...counts,[phase]:(counts[phase] || 0) + 1}; }, {});
        const phases = Object.keys(phaseCounts).sort((a,b) => (phaseOrder[a] ?? 99) - (phaseOrder[b] ?? 99));
        rail.innerHTML = `<div class="module-rail-desktop"><p class="eyebrow">Interaction Nodes</p><p class="module-rail-project">${esc(version.version_id.toUpperCase())} · ${events.length} 条输入</p><select class="context-rail-select" data-rail-version aria-label="交互版本">${state.versions.map(item => `<option value="${esc(item.version_id)}" ${item.version_id === version.version_id ? "selected" : ""}>${esc(item.version_id.toUpperCase())} · ${esc(item.label)}</option>`).join("")}</select><nav class="module-rail-list" aria-label="交互阶段"><button class="module-rail-node ${state.phaseFilter === "all" ? "active" : ""}" data-replay-phase="all" aria-pressed="${state.phaseFilter === "all"}"><span class="module-rail-code">ALL</span><span><span class="module-rail-name">全部交互</span><span class="module-rail-kind">${events.length} events</span></span></button>${phases.map(phase => `<button class="module-rail-node ${state.phaseFilter === phase ? "active" : ""}" data-replay-phase="${esc(phase)}" aria-pressed="${state.phaseFilter === phase}"><span class="module-rail-code">${esc(phaseCodes[phase] || phase.slice(0,3))}</span><span><span class="module-rail-name">${esc(phaseLabels[phase] || phase)}</span><span class="module-rail-kind">${phaseCounts[phase]} events</span></span></button>`).join("")}</nav></div><div class="module-rail-mobile"><select data-rail-version aria-label="交互版本">${state.versions.map(item => `<option value="${esc(item.version_id)}" ${item.version_id === version.version_id ? "selected" : ""}>${esc(item.version_id.toUpperCase())} · ${esc(item.label)}</option>`).join("")}</select><select data-replay-phase-select aria-label="交互阶段"><option value="all" ${state.phaseFilter === "all" ? "selected" : ""}>全部交互 · ${events.length}</option>${phases.map(phase => `<option value="${esc(phase)}" ${state.phaseFilter === phase ? "selected" : ""}>${esc(phaseLabels[phase] || phase)} · ${phaseCounts[phase]}</option>`).join("")}</select></div>`;
        return;
      }
      if (state.mode === "compare") {
        const lensDescriptions = {all:"四个维度同时比较", core:"每版重新定义了什么", added:"这一版引入了什么", replaced:"旧机制如何被替换", trigger:"什么问题触发下一版"};
        rail.innerHTML = `<div class="module-rail-desktop"><p class="eyebrow">Comparison Nodes</p><p class="module-rail-project">V0-V5 比较维度</p><nav class="module-rail-list" aria-label="比较维度">${Object.entries(compareLensLabels).map(([id,label],index) => `<button class="module-rail-node ${state.compareLens === id ? "active" : ""}" data-compare-lens="${id}" aria-pressed="${state.compareLens === id}"><span class="module-rail-code">${id === "all" ? "ALL" : String(index).padStart(2,"0")}</span><span><span class="module-rail-name">${label}</span><span class="module-rail-kind">${lensDescriptions[id]}</span></span></button>`).join("")}</nav></div><div class="module-rail-mobile"><select data-compare-lens-select aria-label="比较维度">${Object.entries(compareLensLabels).map(([id,label]) => `<option value="${id}" ${state.compareLens === id ? "selected" : ""}>${label}</option>`).join("")}</select></div>`;
        return;
      }
      rail.innerHTML = `<p class="eyebrow">Evolution Map</p><p class="project-line">六次迭代，<br>一个不断被修正的生产系统。</p><nav class="version-list" id="version-list">${state.versions.map(v => `
        <button class="version-button ${v.version_id === state.selected ? "active" : ""}" data-version="${esc(v.version_id)}">
          <span class="version-node">${esc(v.version_id.toUpperCase())}</span>
          <span><span class="version-label">${esc(v.label)}</span><span class="version-core">${esc(v.core)}</span></span>
        </button>`).join("")}</nav><div class="rail-note"><p>v0 是机制序章；v1-v5 是主版本。版本时间与 Git 首次提交时间分开记录。</p></div>`;
      document.querySelectorAll("[data-version]").forEach(button => button.addEventListener("click", () => {
        state.selected = button.dataset.version;
        state.filter = "all";
        state.phaseFilter = "all";
        render();
      }));
    }

    function chapterHead(v, compact=false) {
      const events = state.events.filter(e => e.version_ids.includes(v.version_id));
      return `<header class="chapter-head">
        <div class="chapter-meta"><span>${esc(v.version_id)} · ${esc(v.label)}</span><span>${esc(v.date)}</span><span class="chapter-tag">${esc(v.status)}</span><span>${events.length} 条已归档输入</span></div>
        <h1>${esc(v.title)}</h1>
        <p class="chapter-core">${esc(v.core)}${compact ? "" : `。${esc(v.recall_trail.problem)}`}</p>
        ${compact ? "" : `<div class="metric-band">${(v.metrics.length ? v.metrics : [{label:"交互导入",value:"待完成"}]).map(m => `<div class="metric"><span class="metric-value">${esc(m.value)}</span><span class="metric-label">${esc(m.label)}</span></div>`).join("")}<div class="metric"><span class="metric-value">${events.length}</span><span class="metric-label">archived inputs</span></div></div>`}
      </header>`;
    }

    function renderOverview(v) {
      return `${chapterHead(v)}
        <section class="section">
          <div class="section-head"><h2 class="section-title">Recall Trail</h2><span class="section-meta">问题 → 决策 → 动作 → 产物 → 下一版</span></div>
          <div class="recall-trail">${trailLabels.map(([key,label],index) => `<div class="recall-step"><span class="recall-index">0${index+1}</span><span class="recall-name">${label}</span><p class="recall-copy">${esc(v.recall_trail[key])}</p></div>`).join("")}</div>
        </section>
        <section class="section">
          <div class="section-head"><h2 class="section-title">相对上一版发生了什么</h2><span class="section-meta">${v.delta_from ? `${esc(v.delta_from)} → ${esc(v.version_id)}` : "起始机制"}</span></div>
          <div class="change-ledger">${[["preserved","保留"],["added","新增"],["replaced","替换"],["removed","移除"]].map(([key,label]) => `<div class="change-column"><p class="change-title ${key}">${label}</p><ul class="plain-list">${(v.changes[key].length ? v.changes[key] : ["无"]).map(item => `<li>${esc(item)}</li>`).join("")}</ul></div>`).join("")}</div>
        </section>
        <section class="section"><div class="transition-note"><span class="transition-label">Next Trigger</span><p>${esc(v.recall_trail.next_trigger)}</p></div></section>
        ${previewEvents(v)}`;
    }

    function previewEvents(v) {
      const events = withVersionOrdinals(sortVersionEvents(state.events.filter(e => e.version_ids.includes(v.version_id)), v.version_id), v.version_id).slice(0, 3);
      if (!events.length) return `<section class="section"><div class="section-head"><h2 class="section-title">用户锚点</h2><span class="section-meta">导入状态</span></div><div class="empty">该版本的完整交互事件尚未进入公开回放。版本叙事和证据索引已经建立。</div></section>`;
      return `<section class="section"><div class="section-head"><h2 class="section-title">关键用户锚点</h2><button class="filter-button active" id="open-replay">查看 ${state.events.filter(e => e.version_ids.includes(v.version_id)).length} 条交互</button></div><div class="events">${events.map(renderEvent).join("")}</div></section>`;
    }

    function renderEvent(event) {
      const effects = [...(event.assistant.actions || []), ...(event.assistant.observed_effects || [])];
      const phase = state.query ? null : relationFor(event);
      const phaseText = state.query
        ? event.version_relations.map(item => `${item.version_id} · ${phaseLabels[item.relation] || item.relation}`).join(" / ")
        : phaseLabels[phase] || phase;
      return `<article class="event" data-kind="${esc(event.event_type)}" data-event-id="${esc(event.event_id)}">
        <div class="event-head"><div class="event-id"><span class="event-number" title="版本内序号">${String(event.view_sequence ?? event.sequence).padStart(2,"0")}</span><span class="event-type">${esc(event.version_ids.join("/"))}</span><span class="event-phase" data-phase="${esc(phase || "retrospective")}">${esc(phaseText)}</span><span class="event-type">${esc(labels[event.event_type] || event.event_type)}</span><span class="event-time">${esc(formatTime(event.times.source_recorded_at))}</span></div><span class="verified">人工输入已判定</span></div>
        <div class="user-block"><div class="speaker-line"><span class="speaker-mark">YOU</span><span class="speaker-name">用户原始输入</span><span class="speaker-note">verbatim · ${esc(event.privacy.publication)}</span></div><blockquote class="user-text">${esc(event.user.verbatim)}</blockquote></div>
        <div class="assistant-block"><div class="speaker-line"><span class="speaker-mark">AI</span><span class="speaker-name">${esc(event.provider === "codex" ? "Codex" : "Claude")} 核心摘要</span><span class="speaker-note">not verbatim</span></div><p class="assistant-summary">${esc(event.assistant.summary || "该窗口没有可归档的助手回复。")}</p>${event.assistant.core_insights?.length ? `<ul class="insight-list">${event.assistant.core_insights.map(item => `<li>${esc(item)}</li>`).join("")}</ul>` : ""}</div>
        ${effects.length ? `<div class="effect-block"><span class="effect-label">Action / Effect</span><div>${effects.map(item => `<div>→ ${esc(item)}</div>`).join("")}</div></div>` : ""}
        <details class="trace"><summary>来源、分类与时间证据</summary><div class="trace-body"><div><strong>Event ID</strong><code>${esc(event.event_id)}</code></div><div><strong>Source</strong><code>${esc(event.provenance.source_id)} / ${esc(event.provenance.source_message_id)}</code></div><div><strong>Classification</strong>${esc(event.classification.source_record_class)} · ${esc(event.classification.authorship)}</div><div><strong>Privacy</strong>${esc(event.privacy.review_status)} · ${esc(event.privacy.publication)}</div></div></details>
      </article>`;
    }

    function renderEventGroups(events) {
      if (state.query) return `<div class="events">${events.map(renderEvent).join("")}</div>`;
      const groups = [];
      for (const event of events) {
        const phase = relationFor(event);
        let group = groups[groups.length - 1];
        if (!group || group.phase !== phase) {
          group = {phase, events:[]};
          groups.push(group);
        }
        group.events.push(event);
      }
      return groups.map(group => `<section class="phase-group"><div class="phase-divider"><span>${esc(phaseLabels[group.phase] || group.phase)}</span><span class="phase-count">${group.events.length}</span></div><div class="events">${group.events.map(renderEvent).join("")}</div></section>`).join("");
    }

    function renderQueryTimeline(v) {
      if (state.query) return "";
      const timeline = timelineFor(v.version_id);
      const chronological = [...state.events.filter(event => event.version_ids.includes(v.version_id))]
        .sort((a,b) => String(a.times.source_recorded_at || "").localeCompare(String(b.times.source_recorded_at || "")));
      if (!timeline) return `<section class="timeline-board"><div class="timeline-board-head"><div><h2 class="timeline-board-title">Query Timeline</h2><span class="timeline-board-note">${esc(v.version_id)} 的关键节点标注将在全版本阶段补齐；完整交互仍可在下方阅读。</span></div></div></section>`;
      const annotationMap = new Map(timeline.annotations.map(item => [item.event_id, item]));
      const milestoneEvents = chronological.filter(event => annotationMap.has(event.event_id));
      const visible = state.timelineDensity === "all" ? chronological : milestoneEvents;
      const chronologicalOrdinals = new Map(chronological.map((event,index) => [event.event_id,index+1]));
      const nodes = visible.map(event => {
        const note = annotationMap.get(event.event_id);
        const role = note?.role || event.event_type;
        const label = note?.label || short(event.user.verbatim.replace(/\s+/g," "), 34);
        const why = note?.why_it_matters || (event.assistant.summary ? short(event.assistant.summary, 74) : "打开完整交互查看上下文");
        return `<button class="timeline-node" data-role="${esc(role)}" data-jump-event="${esc(event.event_id)}" title="打开第 ${chronologicalOrdinals.get(event.event_id)} 条交互">
          <span class="timeline-node-meta">${String(chronologicalOrdinals.get(event.event_id)).padStart(2,"0")} · ${esc(formatTime(event.times.source_recorded_at))} · ${esc(role)}</span>
          <span><span class="timeline-node-label">${esc(label)}</span><span class="timeline-node-why">${esc(why)}</span></span>
        </button>`;
      }).join("");
      const causal = state.timelineDensity === "milestones" && timeline.causal_edges.length
        ? `<div class="timeline-causal">${timeline.causal_edges.map(edge => `<span class="timeline-causal-item"><strong>${esc(edge.relation)}</strong> · ${esc(edge.label)}</span>`).join("")}</div>`
        : "";
      return `<section class="timeline-board">
        <div class="timeline-board-head"><div><h2 class="timeline-board-title">${esc(timeline.title)}</h2><span class="timeline-board-note">真实时间顺序 · 点击节点跳到完整用户输入 · ${visible.length}/${chronological.length} nodes</span></div>
          <div class="density-switch" aria-label="时间线密度"><button class="density-button ${state.timelineDensity === "milestones" ? "active" : ""}" data-timeline-density="milestones">关键节点</button><button class="density-button ${state.timelineDensity === "all" ? "active" : ""}" data-timeline-density="all">全部输入</button></div></div>
        <div class="timeline-scroll"><div class="timeline-track">${nodes}</div></div>${causal}
      </section>`;
    }

    function renderReplay(v) {
      const all = state.query ? state.events : state.events.filter(e => e.version_ids.includes(v.version_id));
      const events = selectedEvents();
      const types = [...new Set(all.map(e => e.event_type))];
      const head = state.query ? `<header class="chapter-head"><div class="chapter-meta"><span>Global Search</span><span>v0 → v5</span></div><h1>搜索全部构建记忆</h1><p class="chapter-core">当前结果跨越 primary 与 retrospective 事件；每条记录保留版本、来源和作者判定。</p></header>` : chapterHead(v, true);
      return `${head}${renderQueryTimeline(v)}<div class="event-toolbar"><span class="event-count">显示 ${events.length} / ${all.length} 条用户输入${state.query ? ` · 搜索“${esc(state.query)}”` : ""}</span><div class="event-filters"><button class="filter-button ${state.filter === "all" ? "active" : ""}" data-filter="all">全部</button>${types.map(type => `<button class="filter-button ${state.filter === type ? "active" : ""}" data-filter="${esc(type)}">${esc(labels[type] || type)}</button>`).join("")}</div></div>${events.length ? renderEventGroups(events) : `<div class="empty">没有匹配的已归档用户输入。</div>`}`;
    }

    const assumptionLabels = {
      working: "待验证 (working)",
      validated: "已验证 (validated)",
      revised: "已修订 (revised)",
      broken: "已推翻 (broken)"
    };

    function renderRationaleItems(items, assumptions = false) {
      return `<ul class="rationale-list">${items.map(item => `<li class="rationale-item"><p class="rationale-claim">${esc(item.claim)}</p><div class="rationale-meta">${assumptions ? `<span class="assumption-status" data-status="${esc(item.status)}">${esc(assumptionLabels[item.status] || item.status)}</span>` : ""}${item.event_ids.map(eventId => `<button class="rationale-ref" data-open-evidence="${esc(eventId)}" title="${esc(eventId)}">${esc(eventId.split(":").pop())}</button>`).join("")}</div></li>`).join("")}</ul>`;
    }

    function renderModule(v) {
      const module = selectedModuleData();
      if (!module) return `<div class="empty">机制数据尚未载入。</div>`;
      if (!state.selectedStage || !module.stages.some(stage => stage.stage_id === state.selectedStage)) state.selectedStage = module.stages[0].stage_id;
      if (!["map", "design", "stage"].includes(state.moduleFocus)) state.moduleFocus = "map";
      const stage = module.stages.find(item => item.stage_id === state.selectedStage);
      const controlMap = new Map(state.modules.flatMap(item => item.controls).map(control => [control.control_id, control]));
      const design = module.design_context;
      const stageLabels = new Map(module.stages.map(item => [item.stage_id, `${String(item.sequence).padStart(2,"0")} ${item.label}`]));
      const flow = module.stages.map(item => `<button class="module-node ${item.stage_id === stage.stage_id ? "active" : ""}" data-stage-id="${esc(item.stage_id)}" data-outcome="${esc(item.outcome)}" aria-pressed="${item.stage_id === stage.stage_id}">
        <span class="module-node-seq">${String(item.sequence).padStart(2,"0")} · ${esc(item.stage_kind)}</span><span class="module-node-name">${esc(item.label)}</span><span class="module-outcome">${esc(item.outcome)}</span>
      </button>`).join("");
      const feedbackEdges = module.edges.filter(edge => edge.type === "feedback" || edge.type === "rework");
      const feedback = feedbackEdges.length ? `<div class="module-feedback">${feedbackEdges.map(edge => `<span class="module-feedback-item"><strong>${esc(edge.type)}</strong> · ${esc(stageLabels.get(edge.from) || edge.from)} → ${esc(stageLabels.get(edge.to) || edge.to)}<br>${esc(edge.label)}</span>`).join("")}</div>` : "";
      const visibleEvidence = evidenceForStage(stage);
      const selectedEvolution = stage.evolution.find(item => item.version_id === state.selected) || stage.evolution[stage.evolution.length - 1];
      const artifacts = [...new Set([...(selectedEvolution?.artifact_refs || []), ...visibleEvidence.flatMap(item => item.artifact_refs)])];
      const controls = stage.audit_control_ids.map(id => controlMap.get(id)).filter(Boolean);
      const evidenceRows = visibleEvidence.map(item => `<div class="module-evidence-row"><span class="fact-status" data-status="${esc(item.fact_status)}">${esc(item.fact_status)}</span><span class="module-evidence-event"><button class="evidence-jump" data-open-evidence="${esc(item.event_id)}">${esc(item.event_id.split(":").pop())}</button><br>${esc(item.role)}</span><span class="module-evidence-claim">${esc(item.claim)}</span></div>`).join("");
      const controlsMatrix = module.kind === "control" ? `<section class="control-matrix"><div class="section-head"><h2 class="section-title">Audit Controls</h2><span class="section-meta">${module.controls.length} 个控制 · ${esc(state.selected)} 状态不是总 verdict</span></div>${module.controls.map(control => { const view = controlState(control); return `<div class="control-row"><span class="control-name">${esc(control.label)}</span><span class="control-meta">${esc(control.automation)}<br>${esc(view.coverage)}</span><span class="fact-status" data-status="${esc(view.factStatus)}">${esc(view.status)}</span><span class="control-object">${esc(view.summary)}<br><strong>Gate:</strong> ${esc(control.pass_condition)}</span></div>`; }).join("")}</section>` : "";
      const coverageLabel = module.status === "complete" ? `${esc(module.version_ids[0])}→${esc(module.version_ids[module.version_ids.length - 1])} coverage` : `${esc(module.primary_demo_version)} demo`;

      const designPane = state.designPanel === "assumptions"
        ? `<div class="rationale-panel"><p class="rationale-kicker">关键假设 (Assumptions)</p>${renderRationaleItems(design.assumptions, true)}</div>`
        : `<div class="rationale-panel"><p class="rationale-kicker">历史观察 (Observations)</p>${renderRationaleItems(design.observations)}</div>`;
      const designView = `<section class="focus-view"><div class="focus-view-head"><h2 class="focus-view-title">为什么需要这套机制</h2><span class="focus-view-meta">Design Context</span></div>
        <blockquote class="design-focus-quote">${esc(design.justification)}</blockquote>
        <div class="design-anchor-grid"><div class="design-anchor"><span class="design-label">要解决的问题 (Problem)</span><p class="design-copy">${esc(design.problem)}</p></div><div class="design-anchor success"><span class="design-label">成功定义 (Success)</span><p class="design-copy">${esc(design.success_definition)}</p></div></div>
        <div class="focus-switch" aria-label="设计依据类型"><button class="focus-switch-button ${state.designPanel === "observations" ? "active" : ""}" data-design-panel="observations" aria-pressed="${state.designPanel === "observations"}">历史观察</button><button class="focus-switch-button ${state.designPanel === "assumptions" ? "active" : ""}" data-design-panel="assumptions" aria-pressed="${state.designPanel === "assumptions"}">关键假设</button></div>
        <div class="focus-reading-pane">${designPane}</div>
        <details class="focus-disclosure"><summary>V0-V5 演化结论</summary><p>${esc(module.summary)}</p></details>
      </section>`;

      const mapView = `<section class="focus-view module-flow-section"><div class="focus-view-head"><h2 class="focus-view-title">Mechanism Map</h2><span class="focus-view-meta">${module.stages.length} stages · ${feedbackEdges.length} feedback loops</span></div><div class="module-flow"><div class="module-track">${flow}</div>${feedback}</div></section>`;

      const rationalePanel = `<div class="stage-rationale"><div class="stage-why"><span class="design-label">为什么存在这个阶段 (Why)</span><p>${esc(stage.rationale.why)}</p></div><div class="stage-rationale-grid"><div class="rationale-panel"><p class="rationale-kicker">设计依据 (Observations)</p>${renderRationaleItems(stage.rationale.observations)}</div><div class="rationale-panel"><p class="rationale-kicker">依赖假设 (Assumptions)</p>${renderRationaleItems(stage.rationale.assumptions, true)}</div></div></div>`;
      const contractPanel = `<div><div class="io-grid">${[["INPUT",stage.inputs],["ACTION",stage.actions],["OUTPUT",stage.outputs]].map(([label,items]) => `<div class="io-column"><span class="io-label">${label}</span><ul>${items.map(item => `<li>${esc(item)}</li>`).join("")}</ul></div>`).join("")}</div><div class="gate-grid"><div class="gate-line"><span>Entry Gate</span><p>${esc(stage.entry_gate || "未定义")}</p></div><div class="gate-line exit"><span>Exit Gate</span><p>${esc(stage.exit_gate || "未定义")}</p></div></div></div>`;
      const evolutionPanel = `<section class="stage-evolution">${stage.evolution.map(item => `<div class="evolution-row ${item.version_id === state.selected ? "active" : ""}"><span class="evolution-version">${esc(item.version_id)}</span><span class="evolution-status">${esc(item.status)}</span><span class="evolution-summary">${esc(item.summary)}</span></div>`).join("")}</section>`;
      const evidencePanel = `<div><div class="stage-evidence-layout"><section class="module-evidence"><div class="section-head"><h2 class="section-title">Evidence Trail</h2><span class="section-meta">specified ≠ executed ≠ successful</span></div>${evidenceRows}</section><aside class="module-detail-aside"><div class="module-aside-block"><p class="module-aside-title">Audit Controls</p><ul class="control-list">${controls.length ? controls.map(control => { const view = controlState(control); return `<li><strong>${esc(control.label)}</strong><br>${esc(view.status)} · ${esc(view.coverage)}</li>`; }).join("") : "<li>本阶段暂无直接控制映射。</li>"}</ul></div><div class="module-aside-block"><p class="module-aside-title">Artifacts</p><ul class="artifact-list">${artifacts.map(ref => `<li>${esc(ref)}</li>`).join("") || "<li>无独立 artifact。</li>"}</ul></div><div class="module-aside-block"><p class="module-aside-title">Known Gaps</p><ul class="gap-list-compact">${stage.known_gaps.map(gap => `<li>! ${esc(gap)}</li>`).join("") || "<li>无已登记缺口。</li>"}</ul></div></aside></div>${controlsMatrix}</div>`;
      const stageSections = [
        ["01","设计逻辑","观察、假设与阶段存在理由",rationalePanel,"rationale"],
        ["02","执行合同","输入、动作、输出与进入/退出门",contractPanel,"contract"],
        ["03","版本演化","V0-V5 如何引入、修改、失败或替换",evolutionPanel,"evolution"],
        ["04","证据与缺口","事实状态、审计控制、产物与残余风险",evidencePanel,"evidence"]
      ].map(([index,title,meta,content,id]) => `<section class="stage-scroll-section" id="stage-${id}"><div class="stage-scroll-head"><span class="stage-scroll-index">${index}</span><div><h3 class="stage-scroll-title">${title}</h3><p class="stage-scroll-meta">${meta}</p></div></div>${content}</section>`).join("");
      const stageView = `<section class="focus-view"><div class="stage-focus-header"><div><h2 class="stage-focus-heading">${String(stage.sequence).padStart(2,"0")} · ${esc(stage.label)}</h2><p class="module-detail-summary">${esc(stage.summary)}</p></div></div>
        ${stageSections}
      </section>`;

      const body = state.moduleFocus === "design" ? designView : state.moduleFocus === "stage" ? stageView : mapView;
      return `<header class="chapter-head"><div class="chapter-meta"><span>Module Recall</span><span>${coverageLabel}</span><span class="chapter-tag">${esc(module.status)}</span><span>${module.stages.length} stages</span></div><h1>${esc(module.title)}</h1></header>${body}`;
    }

    function renderCompare() {
      if (!Object.hasOwn(compareLensLabels, state.compareLens)) state.compareLens = "all";
      const columns = [
        ["core","核心",v => esc(v.core)],
        ["added","新增",v => v.changes.added.map(esc).join("<br>") || "—"],
        ["replaced","替换",v => v.changes.replaced.map(esc).join("<br>") || "—"],
        ["trigger","下一版触发",v => esc(v.recall_trail.next_trigger)]
      ];
      const visibleColumns = state.compareLens === "all" ? columns : columns.filter(([id]) => id === state.compareLens);
      return `<header class="chapter-head"><div class="chapter-meta"><span>Cross-version Matrix</span><span>v0 → v5</span><span class="chapter-tag">${esc(compareLensLabels[state.compareLens])}</span></div><h1>同一个系统，六次重写生产逻辑</h1><p class="chapter-core">比较的不是文档数量，而是每一版如何重新定义生产对象、证据边界和停止条件。</p></header>
        <section class="section"><div class="matrix-wrap"><table class="matrix ${state.compareLens === "all" ? "" : "focused"}"><thead><tr><th>版本</th>${visibleColumns.map(([,label]) => `<th>${label}</th>`).join("")}</tr></thead><tbody>${state.versions.map(v => `<tr><td>${esc(v.version_id)}<br><span style="color:var(--muted);font-weight:400">${esc(v.title)}</span></td>${visibleColumns.map(([, ,render]) => `<td>${render(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
    }

    function renderEvidence(v) {
      const sourceIds = new Set(v.source_ids);
      const sources = state.sources.filter(s => sourceIds.has(s.source_id));
      const mappings = state.mappings.filter(mapping => mapping.version_id === v.version_id);
      const eventCount = state.events.filter(e => e.version_ids.includes(v.version_id)).length;
      const versionCoverage = state.archive?.coverage.by_version.find(item => item.version_id === v.version_id);
      const coverageLabel = versionCoverage?.complete ? `${versionCoverage.archived}/${versionCoverage.expected}` : `${versionCoverage?.archived ?? eventCount}/?`;
      document.getElementById("evidence-panel").innerHTML = `
        <section class="evidence-section"><p class="evidence-title">Current Decision</p><blockquote class="decision-quote">${esc(v.recall_trail.decision)}</blockquote></section>
        <section class="evidence-section"><p class="evidence-title">Source Desk</p><ul class="source-list">${sources.map(s => `<li class="source-item"><span class="source-kind">${esc(s.provider)} · ${esc(s.coverage)}</span><span class="source-name">${esc(s.source_id)}</span></li>`).join("")}</ul></section>
        ${mappings.length ? `<section class="evidence-section"><p class="evidence-title">Evidence Claims</p><ul class="source-list">${mappings.map(mapping => `<li class="source-item"><span class="source-kind">${esc(mapping.claim_kind)} · ${esc(mapping.confidence)}</span><span class="source-name">${esc(mapping.claim)}</span></li>`).join("")}</ul></section>` : ""}
        <section class="evidence-section"><p class="evidence-title">Known Gaps</p><ul class="gap-list">${v.known_gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul></section>
        <section class="evidence-section"><p class="evidence-title">Archive Integrity</p><ul class="integrity-list"><li class="integrity-row"><span>Schema</span><span class="integrity-value">2.0.0</span></li><li class="integrity-row"><span>用户输入</span><span class="integrity-value">${eventCount}</span></li><li class="integrity-row"><span>版本覆盖</span><span class="integrity-value">${coverageLabel}</span></li><li class="integrity-row"><span>Raw transcript</span><span class="integrity-value">local-only</span></li></ul></section>`;
    }

    function renderModuleEvidence(module) {
      if (!module) return;
      const stage = module.stages.find(item => item.stage_id === state.selectedStage) || module.stages[0];
      const focusLabels = {map:"阶段地图", design:"设计依据", stage:"阶段详情"};
      if (state.moduleFocus === "map") {
        const feedbackCount = module.edges.filter(edge => edge.type === "feedback" || edge.type === "rework").length;
        document.getElementById("evidence-panel").innerHTML = `
          <section class="evidence-section"><p class="evidence-title">Current Focus</p><blockquote class="decision-quote">${esc(module.title)}<br><span style="font-size:11px;color:var(--muted)">${focusLabels.map}</span></blockquote></section>
          <section class="evidence-section"><p class="evidence-title">Map Scope</p><ul class="integrity-list"><li class="integrity-row"><span>Stages</span><span class="integrity-value">${module.stages.length}</span></li><li class="integrity-row"><span>Flow edges</span><span class="integrity-value">${module.edges.length}</span></li><li class="integrity-row"><span>Feedback loops</span><span class="integrity-value">${feedbackCount}</span></li><li class="integrity-row"><span>Versions</span><span class="integrity-value">${module.version_ids.length}/6</span></li></ul></section>
          <section class="evidence-section"><p class="evidence-title">Module Scope</p><p class="source-name">${esc(module.scope)}</p></section>`;
        return;
      }
      if (state.moduleFocus === "design") {
        const assumptionCounts = module.design_context.assumptions.reduce((counts,item) => ({...counts,[item.status]:(counts[item.status] || 0) + 1}), {});
        document.getElementById("evidence-panel").innerHTML = `
          <section class="evidence-section"><p class="evidence-title">Current Focus</p><blockquote class="decision-quote">${esc(module.title)}<br><span style="font-size:11px;color:var(--muted)">${focusLabels.design}</span></blockquote></section>
          <section class="evidence-section"><p class="evidence-title">Design Evidence</p><ul class="integrity-list"><li class="integrity-row"><span>Observations</span><span class="integrity-value">${module.design_context.observations.length}</span></li><li class="integrity-row"><span>Assumptions</span><span class="integrity-value">${module.design_context.assumptions.length}</span></li>${Object.entries(assumptionCounts).map(([key,value]) => `<li class="integrity-row"><span>${esc(key)}</span><span class="integrity-value">${value}</span></li>`).join("")}</ul></section>
          <section class="evidence-section"><p class="evidence-title">Evidence Rule</p><ul class="integrity-list"><li class="integrity-row"><span>观察</span><span class="integrity-value">event-backed</span></li><li class="integrity-row"><span>假设</span><span class="integrity-value">status tracked</span></li></ul></section>`;
        return;
      }
      const factCounts = evidenceForStage(stage).reduce((counts,item) => ({...counts,[item.fact_status]:(counts[item.fact_status] || 0) + 1}), {});
      const controls = state.modules.flatMap(item => item.controls).filter(control => stage.audit_control_ids.includes(control.control_id));
      document.getElementById("evidence-panel").innerHTML = `
        <section class="evidence-section"><p class="evidence-title">Current Stage</p><blockquote class="decision-quote">${esc(stage.label)}<br><span style="font-size:11px;color:var(--muted)">完整阶段</span></blockquote></section>
        <section class="evidence-section"><p class="evidence-title">Fact Status</p><ul class="integrity-list">${Object.entries(factCounts).map(([key,value]) => `<li class="integrity-row"><span>${esc(key)}</span><span class="integrity-value">${value}</span></li>`).join("")}<li class="integrity-row"><span>Module status</span><span class="integrity-value">${esc(module.status)}</span></li></ul></section>
        <section class="evidence-section"><p class="evidence-title">Active Controls</p><ul class="source-list">${controls.map(control => { const view = controlState(control); return `<li class="source-item"><span class="source-kind">${esc(view.status)} · ${esc(view.coverage)}</span><span class="source-name">${esc(control.label)}</span></li>`; }).join("") || `<li class="source-item"><span class="source-name">暂无映射控制</span></li>`}</ul></section>
        <section class="evidence-section"><p class="evidence-title">Known Gaps</p><ul class="gap-list">${stage.known_gaps.map(gap => `<li>${esc(gap)}</li>`).join("") || "<li>无已登记缺口。</li>"}</ul></section>`;
    }

    function bindMainActions() {
      document.querySelectorAll("[data-filter]").forEach(button => button.addEventListener("click", () => { state.filter = button.dataset.filter; render(); }));
      document.querySelectorAll("[data-replay-phase]").forEach(button => button.addEventListener("click", () => { state.phaseFilter = button.dataset.replayPhase; render(); }));
      document.querySelectorAll("[data-compare-lens]").forEach(button => button.addEventListener("click", () => { state.compareLens = button.dataset.compareLens; render(); }));
      document.querySelectorAll("[data-rail-version]").forEach(railVersion => railVersion.addEventListener("change", () => { state.selected = railVersion.value; state.phaseFilter = "all"; state.filter = "all"; render(); }));
      const replayPhaseSelect = document.querySelector("[data-replay-phase-select]");
      if (replayPhaseSelect) replayPhaseSelect.addEventListener("change", () => { state.phaseFilter = replayPhaseSelect.value; render(); });
      const compareLensSelect = document.querySelector("[data-compare-lens-select]");
      if (compareLensSelect) compareLensSelect.addEventListener("change", () => { state.compareLens = compareLensSelect.value; render(); });
      const eventFilterSelect = document.querySelector("[data-event-filter-select]");
      if (eventFilterSelect) eventFilterSelect.addEventListener("change", () => { state.filter = eventFilterSelect.value; render(); });
      document.querySelectorAll("[data-timeline-density]").forEach(button => button.addEventListener("click", () => { state.timelineDensity = button.dataset.timelineDensity; renderMain(); }));
      document.querySelectorAll("[data-jump-event]").forEach(button => button.addEventListener("click", () => {
        state.filter = "all";
        renderMain();
        requestAnimationFrame(() => {
          const target = [...document.querySelectorAll("[data-event-id]")].find(item => item.dataset.eventId === button.dataset.jumpEvent);
          if (!target) return;
          target.scrollIntoView({behavior:"smooth",block:"center"});
          target.classList.add("timeline-target");
          setTimeout(() => target.classList.remove("timeline-target"), 1500);
        });
      }));
      document.querySelectorAll("[data-module-id]").forEach(button => button.addEventListener("click", () => {
        state.selectedModule = button.dataset.moduleId;
        state.selectedStage = null;
        state.moduleFocus = "map";
        state.designPanel = "observations";
        const module = selectedModuleData();
        if (module && !module.version_ids.includes(state.selected)) state.selected = module.primary_demo_version;
        render();
      }));
      document.querySelectorAll("[data-module-focus]").forEach(button => button.addEventListener("click", () => { state.moduleFocus = button.dataset.moduleFocus; render(); }));
      document.querySelectorAll("[data-design-panel]").forEach(button => button.addEventListener("click", () => { state.designPanel = button.dataset.designPanel; render(); }));
      document.querySelectorAll("[data-stage-id]").forEach(button => button.addEventListener("click", () => {
        state.selectedStage = button.dataset.stageId;
        state.moduleFocus = "stage";
        render();
        requestAnimationFrame(() => document.querySelector(".stage-focus-heading")?.scrollIntoView({behavior:"smooth",block:"start"}));
      }));
      const moduleSelect = document.querySelector("[data-module-select]");
      if (moduleSelect) moduleSelect.addEventListener("change", () => {
        state.selectedModule = moduleSelect.value;
        state.selectedStage = null;
        state.moduleFocus = "map";
        state.designPanel = "observations";
        render();
      });
      const moduleNodeSelect = document.querySelector("[data-module-node-select]");
      if (moduleNodeSelect) moduleNodeSelect.addEventListener("change", () => {
        const [kind, value] = moduleNodeSelect.value.split(":");
        if (kind === "focus") state.moduleFocus = value;
        if (kind === "stage") {
          state.selectedStage = value;
          state.moduleFocus = "stage";
        }
        render();
        if (kind === "stage") requestAnimationFrame(() => document.querySelector(".stage-focus-heading")?.scrollIntoView({behavior:"smooth",block:"start"}));
      });
      document.querySelectorAll("[data-open-evidence]").forEach(button => button.addEventListener("click", () => {
        const event = eventById(button.dataset.openEvidence);
        if (!event) return;
        state.selected = event.version_ids.includes(state.selected) ? state.selected : event.version_ids[0];
        state.mode = "replay";
        state.filter = "all";
        render();
        requestAnimationFrame(() => {
          const target = [...document.querySelectorAll("[data-event-id]")].find(item => item.dataset.eventId === event.event_id);
          if (!target) return;
          target.scrollIntoView({behavior:"smooth",block:"center"});
          target.classList.add("timeline-target");
          setTimeout(() => target.classList.remove("timeline-target"), 1500);
        });
      }));
      const replay = document.getElementById("open-replay");
      if (replay) replay.addEventListener("click", () => { state.mode = "replay"; syncModes(); renderMain(); });
    }
    function syncModes() { document.querySelectorAll("[data-mode]").forEach(button => button.classList.toggle("active", button.dataset.mode === state.mode)); }
    function renderMain() {
      const v = selectedVersion();
      document.getElementById("main").innerHTML = state.mode === "compare" ? renderCompare() : state.mode === "module" ? renderModule(v) : state.mode === "replay" ? renderReplay(v) : renderOverview(v);
      bindMainActions();
    }
    function render() {
      renderVersionNav();
      syncModes();
      renderMain();
      if (state.mode === "module") renderModuleEvidence(selectedModuleData()); else renderEvidence(selectedVersion());
      const archived = state.events.length;
      const completeVersions = state.archive?.coverage.by_version.filter(item => item.complete).length ?? 0;
      document.getElementById("coverage").textContent = `${archived} 条输入 · ${completeVersions}/${state.versions.length} 版本完整`;
    }

    document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => {
      state.mode = button.dataset.mode;
      if (state.mode === "module") {
        const module = selectedModuleData();
        if (module && !module.version_ids.includes(state.selected)) state.selected = module.primary_demo_version;
      }
      render();
    }));
    document.getElementById("search").addEventListener("input", event => { state.query = event.target.value.trim(); if (state.query) { state.mode = "replay"; state.phaseFilter = "all"; } render(); });

    loadJson("archive.json").then(async archive => {
      state.archive = archive;
      const [versions, sources, mappings, moduleRegistry, timeline, shards] = await Promise.all([
        loadJson(archive.versions_file),
        loadJson(archive.source_registry_file),
        loadJson(archive.source_map_file),
        loadJson(archive.module_registry_file),
        loadJson(archive.query_timeline_file),
        Promise.all(archive.event_shards.map(shard => loadJsonl(shard.file)))
      ]);
      state.versions = versions.versions;
      state.sources = sources.sources;
      state.mappings = mappings.mappings;
      state.moduleRegistry = moduleRegistry.modules;
      state.timeline = timeline;
      state.modules = await Promise.all(moduleRegistry.modules.map(item => loadJson(item.data_file)));
      state.events = shards.flat().filter(event => event.privacy.review_status === "reviewed" && event.privacy.publication !== "withheld");
      render();
    }).catch(error => { document.getElementById("main").innerHTML = `<div class="error">档案载入失败：${esc(error.message)}</div>`; });
  </script>
</body>
</html>
