<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Wiki · 构建回忆档案</title>
  <style>
    :root {
      --paper: #f4f3ee;
      --surface: #fffefa;
      --ink: #171916;
      --muted: #626860;
      --line: #d2d2ca;
      --line-dark: #9da198;
      --teal: #127b72;
      --coral: #dd5a45;
      --blue: #345aa8;
      --amber: #d89d23;
      --plum: #78547d;
      --left: 232px;
      --right: 292px;
      --top: 66px;
      --radius: 5px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
      letter-spacing: 0;
    }
    button, input { color: inherit; font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    a { color: inherit; }
    code { font-family: "SFMono-Regular", Menlo, monospace; font-size: 11px; }

    .topbar {
      position: sticky;
      z-index: 40;
      top: 0;
      display: grid;
      min-height: var(--top);
      grid-template-columns: minmax(240px, 1fr) minmax(220px, 440px) auto;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid var(--ink);
      background: var(--surface);
    }
    .brand { display: flex; min-width: 0; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      place-items: center;
      border-radius: 2px;
      color: #fff;
      background: var(--ink);
      font-family: "DIN Condensed", "Avenir Next Condensed", sans-serif;
      font-size: 15px;
      font-weight: 800;
    }
    .brand-name { margin: 0; font-size: 13px; font-weight: 800; line-height: 1.2; }
    .brand-sub { overflow: hidden; margin-top: 3px; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .global-search { position: relative; }
    .global-search input {
      width: 100%;
      min-height: 36px;
      padding: 0 36px 0 12px;
      border: 1px solid var(--line-dark);
      border-radius: 3px;
      outline: none;
      background: #fafaf6;
      font-size: 12px;
    }
    .global-search input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(52,90,168,.13); }
    .search-symbol { position: absolute; top: 8px; right: 11px; color: var(--muted); font-size: 15px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .coverage {
      display: inline-flex;
      min-height: 31px;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      border: 1px solid var(--line-dark);
      border-radius: 3px;
      background: #f8f8f3;
      color: #404640;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .coverage::before { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); content: ""; }
    .mode-switch { display: grid; grid-template-columns: repeat(4, 1fr); padding: 2px; border: 1px solid var(--line-dark); border-radius: 4px; background: #f2f2ec; }
    .mode-button { min-height: 28px; padding: 0 9px; border: 0; border-radius: 2px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 800; white-space: nowrap; }
    .mode-button.active { color: #fff; background: var(--ink); }

    .shell {
      display: grid;
      max-width: 1720px;
      min-height: calc(100vh - var(--top));
      margin: 0 auto;
      grid-template-columns: var(--left) minmax(520px, 1fr) var(--right);
      grid-template-areas: "versions content evidence";
      background: var(--surface);
    }
    .versions { grid-area: versions; border-right: 1px solid var(--line); background: #f1f1ec; }
    .rail-sticky { position: sticky; top: var(--top); max-height: calc(100vh - var(--top)); overflow: auto; padding: 20px 14px 30px; }
    .rail-sticky.node-context { padding: 13px 12px 8px; }
    .eyebrow { margin: 0 0 12px; color: var(--muted); font-family: "DIN Condensed", "Avenir Next Condensed", sans-serif; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .project-line { margin: 0 0 19px; font-family: "Iowan Old Style", "Songti SC", serif; font-size: 18px; line-height: 1.35; }
    .version-list { position: relative; display: grid; gap: 2px; }
    .version-list::before { position: absolute; top: 18px; bottom: 18px; left: 20px; width: 1px; background: var(--line-dark); content: ""; }
    .version-button {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 60px;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      padding: 7px 7px 7px 0;
      border: 0;
      border-radius: 3px;
      background: transparent;
      text-align: left;
    }
    .version-button:hover { background: #e6e7e0; }
    .version-button.active { background: var(--surface); box-shadow: inset 3px 0 var(--coral); }
    .version-node {
      z-index: 1;
      display: grid;
      width: 26px;
      height: 26px;
      place-self: center;
      place-items: center;
      border: 1px solid var(--line-dark);
      border-radius: 50%;
      background: #f1f1ec;
      font-family: "DIN Condensed", "Avenir Next Condensed", sans-serif;
      font-size: 11px;
      font-weight: 800;
    }
    .version-button.active .version-node { border-color: var(--ink); color: #fff; background: var(--ink); }
    .version-label { display: block; margin-bottom: 3px; font-size: 12px; font-weight: 800; }
    .version-core { display: -webkit-box; overflow: hidden; color: var(--muted); font-size: 10px; line-height: 1.35; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .rail-note { margin-top: 22px; padding-top: 17px; border-top: 1px solid var(--line); }
    .rail-note p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.65; }
    .module-rail-project { margin: 0 0 8px; font-family: "Iowan Old Style", "Songti SC", serif; font-size: 15px; line-height: 1.3; }
    .module-rail-switch { display: grid; grid-template-columns: 1fr 1fr; padding: 2px; border: 1px solid var(--line-dark); border-radius: 3px; background: #e8e9e3; }
    .module-rail-switch button { min-height: 27px; padding: 0 5px; border: 0; border-radius: 1px; background: transparent; color: var(--muted); font-size: 9px; font-weight: 800; }
    .module-rail-switch button.active { color: #fff; background: var(--ink); }
    .module-rail-list { position: relative; display: grid; gap: 1px; margin-top: 9px; }
    .module-rail-list::before { position: absolute; top: 22px; bottom: 22px; left: 18px; width: 1px; background: var(--line-dark); content: ""; }
    .module-rail-node { position: relative; z-index: 1; display: grid; width: 100%; min-height: 35px; grid-template-columns: 31px minmax(0, 1fr); align-items: center; padding: 2px 7px 2px 0; border: 0; border-radius: 2px; background: transparent; text-align: left; }
    .module-rail-node:hover { background: #e6e7e0; }
    .module-rail-node.active { background: var(--surface); box-shadow: inset 3px 0 var(--teal); }
    .module-rail-node[data-outcome="failed"].active, .module-rail-node[data-outcome="mixed"].active { box-shadow: inset 3px 0 var(--coral); }
    .module-rail-code { display: grid; width: 22px; height: 22px; place-self: center; place-items: center; border: 1px solid var(--line-dark); border-radius: 50%; background: #f1f1ec; color: var(--muted); font-family: "DIN Condensed", "Avenir Next Condensed", sans-serif; font-size: 8px; font-weight: 800; }
    .module-rail-node.active .module-rail-code { border-color: var(--ink); color: #fff; background: var(--ink); }
    .module-rail-name { display: block; overflow: hidden; font-size: 10px; font-weight: 800; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .module-rail-kind { display: block; margin-top: 1px; color: var(--muted); font-size: 7px; font-weight: 700; text-transform: uppercase; }
    .module-rail-node[data-stage-id] .module-rail-kind { display: none; }
    .module-rail-divider { margin: 4px 0 2px 35px; color: var(--muted); font-size: 8px; font-weight: 800; text-transform: uppercase; }
    .module-rail-feedback { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 4px 0 0 32px; padding-top: 4px; border-top: 1px solid var(--line); }
    .module-rail-feedback span { overflow: hidden; color: var(--muted); font-size: 7px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .module-rail-feedback strong { color: var(--coral); }
    .module-rail-mobile { display: none; }
    .context-rail-select { width: 100%; min-height: 34px; margin-bottom: 8px; padding: 0 28px 0 9px; border: 1px solid var(--line-dark); border-radius: 3px; background: var(--surface); font-size: 10px; font-weight: 700; }
    .module-rail-mobile select { width: 100%; min-width: 0; min-height: 38px; padding: 0 28px 0 9px; border: 1px solid var(--line-dark); border-radius: 3px; background: var(--surface); font-size: 11px; font-weight: 700; }

    .content { min-width: 0; grid-area: content; padding: 30px 34px 76px; }
    .chapter-head { padding-bottom: 23px; border-bottom: 1px solid var(--line-dark); }
    .chapter-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-family: "DIN Condensed", "Avenir Next Condensed", sans-serif; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .chapter-tag { padding: 2px 7px; border: 1px solid var(--coral); border-radius: 2px; color: var(--coral); background: #fff4f0; }
    h1 { max-width: 880px; margin: 0 0 12px; font-family: "Iowan Old Style", "Songti SC", "STSong", serif; font-size: 36px; font-weight: 500; line-height: 1.2; }
    .chapter-core { max-width: 820px; margin: 0; color: #4f5750; font-size: 14px; line-height: 1.75; }
    .metric-band { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin-top: 20px; border-block: 1px solid var(--line); }
    .metric { min-height: 63px; padding: 10px 13px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-value { display: block; margin-bottom: 3px; font-family: "DIN Condensed", "Avenir Next Condensed", sans-serif; font-size: 21px; font-weight: 800; }
    .metric-label { display: block; color: var(--muted); font-size: 9px; font-weight: 700; text-transform: uppercase; }

    .section { margin-top: 30px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 13px; }
    .section-title { margin: 0; font-size: 13px; font-weight: 800; }
    .section-meta { color: var(--muted); font-size: 10px; }
    .recall-trail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-block: 1px solid var(--line-dark); }
    .recall-step { position: relative; min-width: 0; padding: 15px 14px 17px; border-right: 1px solid var(--line); }
    .recall-step:last-child { border-right: 0; }
    .recall-index { display: block; margin-bottom: 9px; color: var(--teal); font-family: "DIN Condensed", "Avenir Next Condensed", sans-serif; font-size: 10px; font-weight: 800; }
    .recall-name { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 800; }
    .recall-copy { margin: 0; color: #505850; font-size: 11px; line-height: 1.6; }

    .change-ledger { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); }
    .change-column { min-width: 0; padding: 14px; border-right: 1px solid var(--line); }
    .change-column:last-child { border-right: 0; }
    .change-title { margin: 0 0 10px; color: var(--muted); font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .change-title.added { color: var(--teal); }
    .change-title.replaced { color: var(--blue); }
    .change-title.removed { color: var(--coral); }
    .plain-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .plain-list li { color: #4b534c; font-size: 11px; line-height: 1.5; }
    .plain-list li::before { margin-right: 6px; color: var(--line-dark); content: "•"; }

    .transition-note { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 15px; padding: 16px 18px; border-left: 4px solid var(--coral); background: #fff4ef; }
    .transition-label { color: var(--coral); font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .transition-note p { margin: 0; font-family: "Iowan Old Style", "Songti SC", serif; font-size: 17px; line-height: 1.65; }

    .event-toolbar { display: flex; min-height: 44px; align-items: center; justify-content: space-between; gap: 14px; margin: 18px 0 12px; border-bottom: 1px solid var(--line); }
    .event-count { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .event-filters { display: flex; flex-wrap: wrap; gap: 4px; }
    .filter-button { min-height: 27px; padding: 0 8px; border: 0; border-radius: 2px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 800; }
    .filter-button.active { color: #fff; background: var(--ink); }
    .events { display: grid; gap: 15px; }
    .event { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .event::before { position: absolute; top: 0; bottom: 0; left: 0; width: 4px; background: var(--amber); content: ""; }
    .event[data-kind="correction"]::before { background: var(--coral); }
    .event[data-kind="decision"]::before { background: var(--teal); }
    .event[data-kind="idea"]::before { background: var(--plum); }
    .event-head { display: flex; min-height: 45px; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px 8px 18px; border-bottom: 1px solid var(--line); background: #f6f6f1; }
    .event-id { display: flex; align-items: center; gap: 8px; }
    .event-number { font-family: "DIN Condensed", "Avenir Next Condensed", sans-serif; font-size: 18px; font-weight: 800; }
    .event-type { padding: 2px 6px; border: 1px solid var(--line-dark); border-radius: 2px; background: var(--surface); color: #4d544e; font-size: 9px; font-weight: 800; }
    .event-phase { padding: 2px 6px; border-radius: 2px; color: #fff; background: var(--blue); font-size: 9px; font-weight: 800; }
    .event-phase[data-phase="precursor"] { background: var(--amber); }
    .event-phase[data-phase="handoff"] { background: var(--plum); }
    .event-phase[data-phase="execution"] { background: var(--teal); }
    .event-phase[data-phase="transition_out"] { background: var(--coral); }
    .event-phase[data-phase="retrospective"] { color: var(--ink); background: #d8d8d0; }
    .event-phase[data-phase="operational_context"] { background: var(--blue); }
    .event-time { color: var(--muted); font-size: 9px; }
    .verified { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 9px; font-weight: 800; }
    .verified::before { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); content: ""; }
    .user-block { padding: 19px 20px 22px; }
    .speaker-line { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .speaker-mark { display: grid; width: 25px; height: 25px; place-items: center; border-radius: 2px; color: #fff; background: var(--ink); font-family: "DIN Condensed", sans-serif; font-size: 9px; font-weight: 800; }
    .speaker-name { font-size: 10px; font-weight: 800; }
    .speaker-note { color: var(--muted); font-size: 9px; }
    .user-text { margin: 0; font-family: "Iowan Old Style", "Songti SC", "STSong", serif; font-size: 19px; line-height: 1.78; white-space: pre-wrap; }
    .assistant-block { padding: 17px 20px 18px; border-top: 1px solid var(--line); background: #f4f6fb; }
    .assistant-block .speaker-mark { background: var(--blue); }
    .assistant-summary { margin: 0 0 10px; color: #384038; font-size: 13px; line-height: 1.68; }
    .insight-list { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none; }
    .insight-list li { position: relative; padding-left: 15px; color: #535b54; font-size: 11px; line-height: 1.55; }
    .insight-list li::before { position: absolute; left: 0; color: var(--blue); content: "↳"; }
    .effect-block { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 11px 20px; border-top: 1px solid #c7dbd5; background: #edf7f3; color: #315149; font-size: 11px; line-height: 1.55; }
    .effect-label { color: var(--teal); font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .trace { border-top: 1px solid var(--line); }
    .trace summary { padding: 10px 20px; color: var(--muted); font-size: 10px; font-weight: 800; cursor: pointer; }
    .trace-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px; padding: 2px 20px 16px; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .trace-body strong { display: block; color: var(--ink); font-size: 9px; text-transform: uppercase; }
    .phase-group + .phase-group { margin-top: 24px; }
    .phase-divider { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .phase-divider::after { height: 1px; flex: 1; background: var(--line); content: ""; }
    .phase-count { color: var(--ink); font-variant-numeric: tabular-nums; }

    .timeline-board { margin: 18px 0 20px; border-block: 1px solid var(--line-dark); background: #f8f8f3; }
    .timeline-board-head { display: flex; min-height: 48px; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .timeline-board-title { margin: 0; font-size: 11px; font-weight: 800; }
    .timeline-board-note { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .density-switch { display: grid; flex: 0 0 auto; grid-template-columns: 1fr 1fr; padding: 2px; border: 1px solid var(--line-dark); border-radius: 3px; }
    .density-button { min-height: 25px; padding: 0 8px; border: 0; border-radius: 1px; background: transparent; color: var(--muted); font-size: 9px; font-weight: 800; }
    .density-button.active { color: #fff; background: var(--ink); }
    .timeline-scroll { overflow-x: auto; overscroll-behavior-inline: contain; }
    .timeline-track { position: relative; display: grid; min-width: max-content; grid-auto-flow: column; grid-auto-columns: 152px; gap: 18px; padding: 19px 17px 17px; }
    .timeline-track::before { position: absolute; top: 30px; right: 17px; left: 17px; height: 1px; background: var(--line-dark); content: ""; }
    .timeline-node { position: relative; display: grid; min-width: 0; min-height: 112px; grid-template-rows: 24px auto 1fr; gap: 5px; padding: 0; border: 0; background: transparent; text-align: left; }
    .timeline-node::before { z-index: 1; width: 11px; height: 11px; margin: 6px 0 0 5px; border: 3px solid #f8f8f3; border-radius: 50%; outline: 1px solid var(--line-dark); background: var(--blue); content: ""; }
    .timeline-node[data-role="challenge"]::before, .timeline-node[data-role="failure"]::before { background: var(--coral); }
    .timeline-node[data-role="decision"]::before, .timeline-node[data-role="validation"]::before { background: var(--teal); }
    .timeline-node[data-role="correction"]::before { background: var(--amber); }
    .timeline-node:hover::before, .timeline-node:focus-visible::before { outline: 2px solid var(--ink); }
    .timeline-node-meta { color: var(--muted); font-family: "DIN Condensed", "Avenir Next Condensed", sans-serif; font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .timeline-node-label { max-width: 150px; color: var(--ink); font-size: 11px; font-weight: 800; line-height: 1.4; }
    .timeline-node-why { display: -webkit-box; overflow: hidden; color: var(--muted); font-size: 9px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
    .timeline-causal { display: flex; overflow-x: auto; gap: 7px; padding: 9px 12px; border-top: 1px solid var(--line); background: #f1f1eb; }
    .timeline-causal-item { flex: 0 0 auto; padding-right: 8px; border-right: 1px solid var(--line); color: var(--muted); font-size: 9px; white-space: nowrap; }
    .timeline-causal-item:last-child { border-right: 0; }
    .timeline-causal-item strong { color: var(--ink); }
    .event.timeline-target { animation: timeline-target 1.4s ease-out; }
    @keyframes timeline-target { 0%, 35% { box-shadow: 0 0 0 3px rgba(216,157,35,.38); } 100% { box-shadow: none; } }

    .focus-view { margin-top: 30px; }
    .focus-view-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    .focus-view-title { margin: 0; font-size: 21px; line-height: 1.35; }
    .focus-view-meta { color: var(--muted); font-size: 10px; }
    .design-focus-quote { max-width: 800px; margin: 0; padding: 5px 0 5px 18px; border-left: 4px solid var(--blue); color: #303b4f; font-family: "Iowan Old Style", "Songti SC", serif; font-size: 18px; line-height: 1.72; }
    .design-anchor-grid { display: grid; grid-template-columns: 1fr 1fr; margin-top: 27px; border-block: 1px solid var(--line-dark); }
    .design-anchor { min-width: 0; padding: 17px 16px 19px; }
    .design-anchor + .design-anchor { border-left: 1px solid var(--line); }
    .design-anchor.success { box-shadow: inset 0 3px var(--teal); }
    .design-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .design-copy { margin: 0; color: #414942; font-size: 12px; line-height: 1.7; }
    .focus-switch { display: inline-grid; grid-auto-flow: column; grid-auto-columns: minmax(116px, 1fr); margin-top: 26px; padding: 2px; border: 1px solid var(--line-dark); border-radius: 3px; background: #f1f1ec; }
    .focus-switch-button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 1px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 800; }
    .focus-switch-button.active { color: #fff; background: var(--ink); }
    .focus-reading-pane { max-width: 820px; margin-top: 16px; border-block: 1px solid var(--line-dark); }
    .rationale-panel { min-width: 0; padding: 4px 16px 16px; }

    .assumption-status { padding: 2px 6px; border: 1px solid var(--line-dark); border-radius: 2px; color: var(--muted); font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .assumption-status[data-status="validated"] { border-color: var(--teal); color: var(--teal); }

    .rationale-ref:hover, .rationale-ref:focus-visible { color: var(--ink); }

    .module-feedback { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); border-top: 1px solid var(--line); }

    .stage-scroll-title { margin: 0 0 3px; font-size: 17px; line-height: 1.35; }

    .io-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border-block: 1px solid var(--line); }

    .gate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

    .stage-evidence-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, .7fr); gap: 28px; }

    .artifact-list, .control-list, .gap-list-compact { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .artifact-list li, .control-list li, .gap-list-compact li { overflow-wrap: anywhere; color: #4b534c; font-size: 11px; line-height: 1.55; }

    .fact-status { align-self: start; padding: 3px 6px; border: 1px solid var(--line-dark); border-radius: 2px; color: var(--muted); font-size: 9px; font-weight: 800; text-align: center; text-transform: uppercase; }
    .fact-status[data-status="executed"], .fact-status[data-status="git_verified"] { border-color: var(--teal); color: var(--teal); }

    .matrix-wrap { overflow-x: auto; border: 1px solid var(--line); }

    .matrix th, .matrix td { padding: 13px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }

    .empty { padding: 44px 20px; border: 1px dashed var(--line-dark); color: var(--muted); text-align: center; font-size: 12px; line-height: 1.7; }

    .evidence-sticky { position: sticky; top: var(--top); max-height: calc(100vh - var(--top)); overflow: auto; padding: 20px 17px 30px; }
    .evidence-section + .evidence-section { margin-top: 21px; padding-top: 17px; border-top: 1px solid var(--line); }

    .source-list, .gap-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .source-item { padding: 9px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
    .source-kind { display: block; margin-bottom: 4px; color: var(--teal); font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .source-name { display: block; overflow-wrap: anywhere; color: #414842; font-size: 10px; line-height: 1.5; }
    .gap-list li { position: relative; padding-left: 14px; color: #555d56; font-size: 10px; line-height: 1.6; }
    .gap-list li::before { position: absolute; left: 0; color: var(--amber); content: "!"; font-weight: 800; }
    .integrity-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .integrity-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 10px; }
    .integrity-value { color: var(--ink); font-weight: 800; text-align: right; }
    .decision-quote { margin: 0; padding: 12px 12px 13px; border-left: 4px solid var(--teal); background: #edf7f3; color: #294940; font-family: "Iowan Old Style", "Songti SC", serif; font-size: 15px; line-height: 1.6; }

    @media (max-width: 1220px) {
      .shell { grid-template-columns: var(--left) minmax(500px, 1fr); grid-template-areas: "versions content" "versions evidence"; }
      .evidence { border-top: 1px solid var(--line); border-left: 0; }
      .evidence-sticky { position: static; display: grid; max-height: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 26px; }

    @media (min-width: 741px) and (max-width: 900px) {
      .topbar { grid-template-columns: minmax(210px, 1fr) minmax(190px, 280px) auto; gap: 10px; padding-inline: 12px; }
      .coverage { display: none; }
      .top-actions { gap: 0; }
    }
    @media (max-width: 740px) {
      :root { --top: auto; }
      .topbar { position: static; grid-template-columns: 1fr auto; padding: 10px 12px; gap: 10px; }
      .global-search { grid-column: 1 / -1; grid-row: 2; }
      .coverage { display: none; }
      .shell { display: block; min-height: auto; }
      .versions { overflow: hidden; border-right: 0; border-bottom: 1px solid var(--line); }

      .project-line, .rail-note, .versions .eyebrow { display: none; }

      .module-rail-mobile { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .version-list { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
      .version-list::before { display: none; }
      .version-button { width: 118px; min-width: 118px; min-height: 52px; grid-template-columns: 30px minmax(0,1fr); padding: 5px; }
      .version-node { width: 24px; height: 24px; }
      .version-core { -webkit-line-clamp: 1; }
      .content { padding: 23px 16px 58px; }
      h1 { font-size: 30px; }
      .recall-trail { grid-template-columns: 1fr; }
      .recall-step { display: grid; grid-template-columns: 36px 88px minmax(0,1fr); gap: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
      .recall-step:last-child { border-bottom: 0; }
      .recall-index, .recall-name { margin: 0; }
      .change-ledger { grid-template-columns: 1fr 1fr; }
      .change-column:nth-child(2) { border-right: 0; }
      .change-column:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .transition-note { grid-template-columns: 1fr; gap: 5px; }
      .event-head { align-items: flex-start; }
      .verified { display: none; }
      .user-text { font-size: 17px; }
      .effect-block { grid-template-columns: 1fr; gap: 5px; }
      .trace-body { grid-template-columns: 1fr; }
      .stage-evidence-layout { grid-template-columns: 1fr; }
      .module-detail-aside { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .module-aside-block + .module-aside-block { margin-top: 0; padding-top: 0; border-top: 0; }
      .evidence-sticky { grid-template-columns: 1fr; padding: 18px 16px 30px; }
      .evidence-section + .evidence-section { padding-top: 16px; border-top: 1px solid var(--line); }
    }
    @media (max-width: 520px) {
      .brand-sub { max-width: 150px; }
      .mode-button { padding: 0 6px; }
      .chapter-core { font-size: 13px; }
      .metric-band { grid-template-columns: 1fr 1fr; }
      .metric:nth-child(2n) { border-right: 0; }
      .change-ledger { grid-template-columns: 1fr; }
      .change-column { border-right: 0; border-bottom: 1px solid var(--line); }
      .change-column:last-child { border-bottom: 0; }
      .event-toolbar { align-items: flex-start; flex-direction: column; padding-bottom: 10px; }
      .timeline-board-head { align-items: flex-start; flex-direction: column; }
      .focus-view-head, .stage-focus-header { align-items: stretch; flex-direction: column; }
      .design-anchor-grid, .stage-rationale-grid { grid-template-columns: 1fr; }
      .design-anchor + .design-anchor, .stage-rationale-grid .rationale-panel + .rationale-panel { border-top: 1px solid var(--line); border-left: 0; }
      .module-node { min-height: 118px; }
      .io-grid, .gate-grid, .module-detail-aside { grid-template-columns: 1fr; }

      .control-object { grid-column: 1 / -1; }
