    candidate_statement: "LLM Wiki 的首版 risks/governance/provenance 节点应把风险界定为 source-preserving wiki 维护循环中的 traceability 和 state-change 问题：LLM/agent 将 raw sources 编译成持久 wiki 后，可能出现 citation/claim provenance 漂移、编译丢事实、stale/contradictory pages、弱证据被 canonical 化、未审阅写回、敏感来源暴露，以及来自相邻 RAG/GraphRAG/agent-memory 系统的 source/memory poisoning 类比威胁；可证的治理边界是 source preservation、claim-level citation、review/approve/reject gates、lint/audit、confidence/contradiction labels、hash/change detection、rollback/deletion policy 和 human approval，而不是企业合规充分性或已实证的风险降低。"
    why_it_matters: "该节点为后续 generation/audit 提供风险和治理边界，防止 LLM Wiki 被写成天然可信、自动自治或企业安全方案，也防止把相邻安全论文的攻击率直接外推到 LLM Wiki。"
    direct_evidence:
      - source_id: repo-atomicstrata-llm-wiki-compiler
        supports:
          - source attribution and paragraph source markers
          - claim-level line-range citations and lint validation
          - candidate review queue with approve/reject/archive
          - confidence, provenanceState, contradictedBy metadata
          - low-confidence, contradicted-page, and uncited-paragraph linting
          - roadmap gaps for rollback, audit, stale-claim checks, freshness reports, and operation logs
        limitation: "Implementation evidence only; not proof all LLM Wikis provide these controls or that controls are effective."
      - source_id: repo-kytmanov-obsidian-local
        supports:
          - source hashes for synthesis pages
          - refusal to overwrite manually edited synthesis
          - draft review, rejection feedback, low-confidence/single-source annotations
          - stale article linting and inline source citations
          - conservative item ledger for named references without sufficient source support
        limitation: "Implementation evidence only; local-first single project."
