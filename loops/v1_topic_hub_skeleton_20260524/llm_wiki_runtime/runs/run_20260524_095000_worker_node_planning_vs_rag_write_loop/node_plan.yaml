node_id: 20260524_094000_llm_wiki_vs_rag_write_loop
title: "LLM Wiki vs RAG: write-loop artifact boundary"
purpose: "Define the minimum source-backed boundary between LLM Wiki as a durable maintained wiki/node artifact and RAG/GraphRAG/agent-memory mechanisms for retrieval, indexing, synthesis, and memory."
version_target: "1.0"
source_mining_run: .llmwiki/runs/run_20260524_094000_worker_source_mining_vs_rag_write_loop
frontier_state:
  candidate_status: ready_to_build
  evidence_state: enough_for_first_version
  retrieval_required_before_build: false
non_goals:
  - "Do not frame the node as retrieval versus no retrieval."
  - "Do not claim LLM Wiki is better than RAG."
  - "Do not claim RAG lacks indexes, summaries, citations, memory, durable artifacts, or write paths."
  - "Do not produce a broad product, ecosystem, vendor, PKM, documentation-system, data-catalog, knowledge-graph, or enterprise comparison."
  - "Do not make empirical performance, token-efficiency, scale-threshold, adoption, access-control, concurrency, or enterprise-readiness claims."
  - "Do not use prior KB anchors as primary evidence for new RAG, GraphRAG, citation, or agent-memory facts."
claim_outline:
  - claim_id: c010_01_llm_wiki_artifact_boundary
    claim: "LLM Wiki's source-backed distinction is a persistent wiki/node artifact maintained between raw sources and users, not the absence of retrieval."
    required_citations:
      - karpathy-gist-llm-wiki
      - repo-atomicstrata-llm-wiki-compiler
  - claim_id: c010_02_writeback_lint_update_loop
    claim: "The LLM Wiki side includes writeback/file-back behavior and maintenance checks such as linting contradictions, stale claims, orphan pages, missing cross-references, and gaps."
    required_citations:
      - karpathy-gist-llm-wiki
      - repo-atomicstrata-llm-wiki-compiler
  - claim_id: c010_03_retrieval_coexists
    claim: "A concrete LLM Wiki implementation can include retrieval/search/embeddings while still centering saved wiki artifacts, provenance, index rebuild, and lint/review workflows."
    required_citations:
      - repo-atomicstrata-llm-wiki-compiler
  - claim_id: c010_04_rag_graphrag_baseline
    claim: "RAG and GraphRAG should be described as retrieval/index/summarization and answer-synthesis mechanisms; GraphRAG in particular has graph indexes and pregenerated community summaries."
    required_citations:
      - arxiv-graphrag
      - arxiv-ragas
  - claim_id: c010_05_citation_overlap_not_equivalence
    claim: "Retrieval-grounded answer generation can include citation-quality evaluation, which overlaps with LLM Wiki's provenance concerns but does not by itself define a maintained wiki artifact."
    required_citations:
      - arxiv-alce
      - repo-atomicstrata-llm-wiki-compiler
  - claim_id: c010_06_agent_memory_adjacency
    claim: "Agent-memory systems provide adjacent persistent read/write and traceability mechanisms, but the available evidence only supports contrast with temporal KG or JSON memory stores, not equivalence to LLM Wiki."
    required_citations:
      - arxiv-zep
      - langchain-long-term-memory-docs
  - claim_id: c010_07_early_discourse
    claim: "Early discourse included 'just RAG' and write-loop interpretations; use this only to frame why the boundary matters."
    required_citations:
      - hacker-news-original-thread
