risk_controls:
  source_typing:
    - "Mark every substantive claim as primary LLM Wiki-specific, adjacent, process/framework, discourse, or prior-KB continuity."
  overclaim_control:
    - "Use 'supports a bounded analogy' for adjacent security papers."
    - "Use 'documents in this implementation' for project README controls."
    - "Use 'control vocabulary' for OWASP/NIST/Microsoft unless detailed preserved text supports more."
  citation_control:
    - "Every risk/control claim must cite at least one allowed source and indicate source type."
    - "Do not cite prior KB as primary evidence for risks or controls."
  provenance_control:
    - "Keep source paths and source ids explicit in provenance.md."
    - "State deferred retrieval gaps rather than filling them with assumptions."
  generation_file_control:
    - "Generation may only write version-bundle files under nodes/20260524_104000_llm_wiki_risks_governance_and_provenance/versions/1.0/."
    - "Generation must not write adopted root nodes/20260524_104000_llm_wiki_risks_governance_and_provenance/node.yaml."
adoption_gate:
  required_before_adoption:
    - "citation audit verifies all substantive claims against allowed source types"
    - "audit confirms adjacent threat models are not presented as LLM Wiki incidents"
    - "audit confirms no enterprise/compliance/measured-effectiveness claims slipped in"
    - "audit confirms root node.yaml is absent before adoption"
  first_version_outputs:
    - nodes/20260524_104000_llm_wiki_risks_governance_and_provenance/versions/1.0/node.yaml
    - nodes/20260524_104000_llm_wiki_risks_governance_and_provenance/versions/1.0/card.md
    - nodes/20260524_104000_llm_wiki_risks_governance_and_provenance/versions/1.0/provenance.md
