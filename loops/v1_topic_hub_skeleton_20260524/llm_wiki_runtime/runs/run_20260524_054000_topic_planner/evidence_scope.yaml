audit_gates:
  object_topic_gate: "必须证明 node 内容是 LLM Wiki topic，不是 KB 生产机制。"
  evidence_scope_gate: "所有内容必须来自 allowed scope；额外读取需记录。"
  citation_gate: "关键事实必须绑定 source id、raw path、claim id 或 coverage record。"
  source_sufficiency_gate: "起源事实必须至少由 Karpathy gist/X mirror/HN 原帖之一支持。"
  distinction_gate: "区分 observed fact、interpretation、early discourse、known gap。"
  overclaim_gate: "不得输出本地证据不支持的 empirical/enterprise/adoption 强结论。"
  language_gate: "中文为主，英文术语可保留。"
  retrieval_gate: "不得执行 web retrieval；证据不足时只记录 request。"
